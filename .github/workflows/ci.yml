name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: make build
      - run: make vet
      - run: make test
      - run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: run ./...
